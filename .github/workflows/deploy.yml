name: Deploy React Native Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Expo GitHub Pages base path
        run: |
          node -e "
          const fs = require('fs');
          const file = 'app.json';
          if (!fs.existsSync(file)) {
            throw new Error('app.json not found. Check your Expo configuration.');
          }
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.expo = config.expo || {};
          config.expo.experiments = config.expo.experiments || {};
          config.expo.experiments.baseUrl = '/react-native-app-demo';
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          "

      - name: Build web app
        run: npx expo export --platform web

      - name: Prepare GitHub Pages
        run: |
          touch dist/.nojekyll
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
